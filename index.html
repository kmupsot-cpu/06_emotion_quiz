<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情緒調節｜15 題課後測驗</title>
<style>
:root{--ink:#203330;--accent:#17685d;--muted:#60716d;--line:#dce4df}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8}main{max-width:920px;margin:auto;padding:50px 28px 70px}header{border-top:6px solid var(--accent);padding-top:22px;margin-bottom:28px}.eyebrow{font-size:14px;letter-spacing:.12em;color:var(--accent)}h1{font-size:clamp(28px,5vw,40px);margin:8px 0}p{margin:8px 0}.intro{color:var(--muted)}.meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}.meta input{border:0;border-bottom:1px solid #9aa9a3;background:transparent;padding:5px;font:inherit;width:150px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);border-radius:6px;padding:9px 17px;background:white;color:var(--accent)}button.primary{background:var(--accent);color:white}button:hover{filter:brightness(.94)}#result{padding:16px 0;font-weight:600}article{background:white;padding:24px 28px;border-bottom:1px solid var(--line);margin:0 0 15px;border-radius:8px}h2{font-size:18px;line-height:1.7;margin:0 0 15px}.number{color:var(--accent);margin-right:9px}fieldset{margin:0;padding:0;border:0;min-width:0}legend{float:left;width:100%}.options{clear:both}label.option{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:5px;cursor:pointer;margin:3px 0}label.option:hover{background:#f1f6f2}.option input{margin-top:8px;flex-shrink:0;accent-color:var(--accent)}.correct{background:#e5f3e9!important}.incorrect{background:#fae9e5!important}.feedback{font-size:14px;font-weight:600;color:var(--accent)}.explanation{border-top:1px solid var(--line);margin-top:15px;padding-top:13px;font-size:15px}.source{color:var(--muted);font-size:13px}.hidden{display:none}footer{font-size:13px;color:var(--muted);margin-top:30px}.printnote{display:none}@media(max-width:600px){main{padding:24px 14px}article{padding:20px 16px}}@media print{@page{margin:16mm}body{background:white;color:#111}main{max-width:none;padding:0}header{margin-bottom:18px}h1{font-size:25px}.tools,#result,.feedback{display:none!important}article{padding:12px 0;margin:0;border-radius:0;break-inside:avoid}label.option{padding:2px 0;margin:0}h2{font-size:12pt;margin-bottom:7px}body{font-size:11pt}.intro,.source,footer{color:#333}.correct,.incorrect{background:transparent!important}.explanation{font-size:10pt}.printnote{display:block;font-size:10pt}.meta input{width:120px}}
</style></head><body><main>
<header><div class="eyebrow">心理疾病職能治療學 · 115 學年度第 1 學期</div><h1>情緒調節｜課後測驗</h1><p class="intro">15 題四選一單選題，每題僅有一個最適當答案。建議作答時間 25–30 分鐘。</p><p class="intro">每題 1 分，滿分 15 分。請依講義所述概念與情境判斷。</p><div class="meta"><label>姓名 <input aria-label="姓名"></label><label>學號 <input aria-label="學號"></label></div></header>
<div class="tools"><button class="primary" id="grade">提交並計分</button><button id="answers" aria-pressed="false">顯示答案與解析</button><button id="print">列印／另存 PDF</button><button id="reset">清除作答</button></div>
<p class="intro" style="font-size:14px">可離線使用。列印會依目前狀態顯示或隱藏解析；若要列印學生題本，請先隱藏答案與解析。作答不會傳送至網路，重新載入頁面後會清除。</p><div id="result" role="status" aria-live="polite"></div><form id="quiz"></form>
<noscript><p>請啟用瀏覽器 JavaScript 以顯示題目與使用計分功能。</p></noscript>
<footer>命題依據：《115-1 06 情緒調節 (Emotional Regulation)》講義。解析所附頁次指原始簡報投影片編號。情境為命題改寫，並非量表原始題項。量表相關題目保留講義所述適用對象與使用限制。</footer>
</main><script>
const questions=[{"topic": "情緒概念", "ref": "第 5 張", "q": "個案表示：「這幾天一直覺得低落，但說不上是什麼事情造成的。」此描述最符合哪一概念？", "o": ["情緒（Emotion）", "心境（Mood）", "情感表現（Affect）", "內感知（Interoception）"], "a": 1, "e": "心境是持續較久、較擴散的背景情緒狀態，常無明確誘因。情緒通常與特定刺激有關；情感表現則著重他人可觀察到的表情、語調與動作。"}, {"topic": "情緒模態模型", "ref": "第 9–10 張", "q": "實習生看到長者拒絕活動，原先解讀為「他不信任我」，後來改想「他可能因疼痛而不想參加」，焦慮因此減輕。依情緒模態模型，這個改變最直接發生在哪一環節？", "o": ["情境：長者已接受活動邀請", "注意：完全不再注意長者反應", "反應：只改變外在表情", "評估：改變對拒絕行為的意義解讀"], "a": 3, "e": "相同情境可因不同的主觀評估而產生不同情緒。此例改變的是對長者拒絕行為的理解，未顯示外在情境已改變。"}, {"topic": "內感知", "ref": "第 11 張", "q": "一位不易描述感受的長者在活動中突然躁動，同時出現呼吸變淺、肌肉緊繃。依講義的內感知觀點，治療師最合適的初步做法為何？", "o": ["觀察身體訊號，進一步釐清疼痛、疲倦或其他身體需求", "先將躁動視為拒絕配合，維持原活動要求", "僅要求長者說出情緒名稱，再決定是否協助", "只以當天活動完成率判斷其情緒狀態"], "a": 0, "e": "內感知涉及接收與解讀身體內部訊號。當個案難以表達時，呼吸、姿勢、表情與食慾可提供線索，需再釐清可能的身體需求，不能直接把行為等同於不合作。"}, {"topic": "雙系統與神經網絡", "ref": "第 12 張", "q": "長者聽到突然的巨響後驚慌、僵住。依講義的雙系統觀點，下列處理何者最適當？", "o": ["立即要求完整分析巨響的來源與機率", "持續增加聲音刺激，要求適應後再休息", "先降低刺激並提供安全感，再引導辨識情緒與理解情境", "將反應完全歸因於杏仁核，無須考慮記憶與環境"], "a": 2, "e": "講義建議先降低刺激、提供安全感，再引導較慢的反思與調節。雙系統是功能上的簡化模型，情緒來自多個腦區的雙向互動，不能歸結為單一情緒中心。"}, {"topic": "OTPF-4 架構", "ref": "第 14 張", "q": "治療師評估一名學生因焦慮而難以持續參與分組討論。下列架構定位與臨床分析何者正確？", "o": ["情緒是獨立職能領域，應與學生角色分開評估", "情緒功能屬個案因素，學生角色屬表現型態，需分析焦慮如何影響參與", "學生角色屬身體功能，焦慮屬表現型態", "只要情緒強度下降，即可推定分組參與已改善"], "a": 1, "e": "講義將情緒定位於「個案因素→身體功能→特定心理功能」，角色則屬表現型態。臨床仍須確認情緒對表現技能、社會互動與職能參與的實際影響。"}, {"topic": "評估工具選擇", "ref": "第 16、18、20 張", "q": "治療師想了解一名成人在備餐、購物等日常職能中，正向與負向情緒出現的頻率，以找出介入活動。最符合目的的工具為何？", "o": ["日常生活情緒體驗量表（EEADLs）", "情緒調節問卷（ERQ）", "多倫多述情障礙量表（TAS-20）", "五面向正念問卷（FFMQ）"], "a": 0, "e": "EEADLs 直接連結成人日常職能與情緒經驗頻率。ERQ 著重慣用的認知重評與表達抑制；TAS-20 著重情緒識別與描述困難；FFMQ 著重正念特質。"}, {"topic": "EEADLs 施測", "ref": "第 18–19 張", "q": "施測 EEADLs 時，個案表示某項活動目前每週都沒有進行。依講義，治療師應如何處理該項目？", "o": ["將五種情緒頻率均填為最低分", "請個案想像若進行該活動可能有何感受後評分", "以家屬對該活動的印象代填", "跳過該活動，不予評分"], "a": 3, "e": "依講義，EEADLs 僅評估個案每週固定進行的活動，未進行的活動跳過、不評分。沒有參與活動並不代表參與時沒有情緒。"}, {"topic": "ERSA 解讀", "ref": "第 21–23 張", "q": "一名 18 歲青少年的 ERSA「身體活動」分量表分數高於其他策略。下列解讀何者最適當？", "o": ["已證明身體活動是他所有情境下最有效的策略", "可依此分數判定他沒有情緒調節困難", "表示相對偏好使用身體活動，仍須訪談其使用情境與實際效果", "可直接以該分數套用所有兒童與成人的診斷標準"], "a": 2, "e": "ERSA 分量表高分代表較偏好該策略，不等同策略一定有效或足以診斷。講義指出此工具仍屬初步量表，缺乏常模、臨床切截分數及充分跨族群驗證。"}, {"topic": "神經心理評估", "ref": "第 24 張", "q": "腦傷個案常誤解他人的憤怒表情，且自認社交表現良好，家屬卻反映明顯困難。依講義，下列評估組合何者最能對應這兩項疑問？", "o": ["以 EEADLs 評估臉部辨識，再以 ERSA 比較自評與他評", "以 FEEST／Ekman 60 評估情緒辨識，並結合 DEX 自評／他評落差與行為觀察", "以 FFMQ 判定腦傷位置，再以 ERQ 測量自知力", "僅使用 TAS-20，即可同時確認面部辨識能力與自知力"], "a": 1, "e": "FEEST／Ekman 60 檢視面部基本情緒辨識能力；DEX 的自評與他評落差可提供自知力的線索。講義強調應結合社會行為觀察綜合判讀，不能只憑差異分數下結論。"}, {"topic": "Gross：情境修飾", "ref": "第 26 張", "q": "個案已進入手作團體，但因現場吵雜而焦慮。治療師將其座位移到較安靜處，並把活動步驟分段呈現。此介入主要屬於哪種策略？", "o": ["情境選擇（Situation Selection）", "注意力調配（Attentional Deployment）", "認知重評（Cognitive Reappraisal）", "情境修飾（Situation Modification）"], "a": 3, "e": "治療師調整已發生情境中的環境刺激與活動要求，屬情境修飾。情境選擇較著重事前決定參加何種活動；認知重評則改變對情境的解讀。"}, {"topic": "Gross：認知重評", "ref": "第 26 張", "q": "學生收到老師的修改建議後，從「老師認為我完全沒有能力」改為「這些建議指出我可以改進的部分」，並願意繼續完成報告。此策略最符合何者？", "o": ["認知重評：重新建構事件的意義", "表達抑制：隱藏已產生的外在情緒表達", "情境選擇：事前避免收到建議", "情境修飾：直接改變老師給予的內容"], "a": 0, "e": "認知重評涉及檢視自動化思維並重新詮釋情境。此例改變了對修改建議的意義理解，進而影響情緒與後續行動。"}, {"topic": "DBT 困擾耐受", "ref": "第 27 張", "q": "個案在衝突後情緒強烈，當下難以進行認知討論。依講義的 DBT 困擾耐受觀點，哪項介入最合適？", "o": ["立即要求列出所有不合理信念並逐一反駁", "要求將情緒壓住，直到他人看不出來", "依個案偏好使用感官撫慰包或可投入的活動，協助度過當下痛苦", "等到負向情緒完全消失後，才允許參與活動"], "a": 2, "e": "困擾耐受強調以注意力轉移與自我撫慰等方式協助忍受當下痛苦，講義並以職能參與及感官撫慰包為例。當下不必只依賴認知改變。"}, {"topic": "正念導向職能治療", "ref": "第 27 張", "q": "治療師在園藝活動中，邀請個案留意泥土觸感、呼吸與手部動作，分心後再把注意帶回當下。此介入最符合哪一原則？", "o": ["以作品完成速度作為唯一治療重點", "透過反覆檢討過去失敗來維持專注", "以壓抑身體感覺減少情緒波動", "將正念融入日常職能，促進當下軀體覺察"], "a": 3, "e": "MBOT 將正念融入園藝、慢食、手作等日常職能，重視當下經驗與軀體覺察。題目中的觸感、呼吸與動作觀察符合此原則。"}, {"topic": "行為活化", "ref": "第 28 張", "q": "個案因情緒低落逐漸停止原本喜歡的活動。依行為活化原則，哪項計畫最適當？", "o": ["先等待動機完全恢復，再安排日常活動", "透過活動分析，排入可完成且具有掌控感或愉悅感的活動，追蹤參與情形", "只討論低落的原因，暫不安排實際活動", "以高難度且密集的活動填滿所有空檔，減少思考時間"], "a": 1, "e": "行為活化透過活動分析與時間安排，增加帶來掌控感、愉悅感之職能的參與頻率。臨床計畫需兼顧可行性，不能只等待心情或動機先改善。"}, {"topic": "正向品味", "ref": "第 28 張", "q": "個案參加野餐前想像喜歡的食物，野餐時專注品嘗與景色，結束後再翻看照片回味。這三個階段依序對應哪一組品味策略？", "o": ["事前預期、當下沉浸、事後追憶", "當下沉浸、事後追憶、事前預期", "事後追憶、事前預期、當下沉浸", "情境選擇、表達抑制、認知重評"], "a": 0, "e": "品味策略包括事前預期（Anticipation）、當下沉浸（Experience）、事後追憶（Reminiscence），分別透過期待、投入當下與回味美好來延長正向情緒經驗。"}];const form=document.getElementById('quiz');const letters='ABCD';let answersVisible=false;let graded=false;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
questions.forEach((q,i)=>{const article=el('article');const fs=el('fieldset');const legend=el('legend');const h=el('h2');h.append(el('span','number',String(i+1).padStart(2,'0')),document.createTextNode(q.q));legend.append(h);fs.append(legend);const opts=el('div','options');q.o.forEach((opt,j)=>{const label=el('label','option');label.id=`q${i}o${j}`;const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;label.append(radio,el('span','',letters[j]+'. '+opt));opts.append(label)});fs.append(opts);article.append(fs,el('div','feedback'));const exp=el('div','explanation hidden');exp.append(el('strong','',`答案：${letters[q.a]}　｜　${q.topic}`),el('p','',q.e),el('p','source','講義依據：'+q.ref));article.append(exp);form.append(article)});
function showAnswers(show){answersVisible=show;document.querySelectorAll('.explanation').forEach(n=>n.classList.toggle('hidden',!show));document.getElementById('answers').textContent=show?'隱藏答案與解析':'顯示答案與解析';document.getElementById('answers').setAttribute('aria-pressed',String(show))}
function clearMarks(){document.querySelectorAll('.option').forEach(n=>n.classList.remove('correct','incorrect'));document.querySelectorAll('.feedback').forEach(n=>n.textContent='')}
document.getElementById('grade').onclick=()=>{clearMarks();let score=0,done=0;questions.forEach((q,i)=>{const selected=form.querySelector(`input[name="q${i}"]:checked`);const feedback=form.children[i].querySelector('.feedback');if(selected){done++;const v=Number(selected.value);if(v===q.a){score++;feedback.textContent='答對'}else{feedback.textContent=`答錯，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${v}`).classList.add('incorrect')}}else feedback.textContent=`未作答，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${q.a}`).classList.add('correct')});document.getElementById('result').textContent=`得分 ${score}／15 分（${Math.round(score/15*100)}%）・已答 ${done} 題・未答 ${15-done} 題。未答題以 0 分計。`;graded=true;showAnswers(true)};
document.getElementById('answers').onclick=()=>{showAnswers(!answersVisible);if(!answersVisible){clearMarks();document.getElementById('result').textContent='';graded=false}};
form.addEventListener('change',()=>{if(graded){clearMarks();document.getElementById('result').textContent='作答已變更，請重新提交計分。';graded=false}});
document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>{form.reset();clearMarks();showAnswers(false);graded=false;document.getElementById('result').textContent='已清除作答。'};
</script></body></html>
